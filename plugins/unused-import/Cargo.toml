[package]
name = "ferrolint-plugin-unused-import"
version.workspace = true
edition.workspace = true
description = "Sample ferrolint plugin: a port of Pylint's unused-import checker (W0611)"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
