name: release
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: make release-build TARGET=${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: file target/${{ matrix.target }}/release/ferrolint | grep -E 'statically linked|static-pie linked'
      - run: make smoke BIN=target/${{ matrix.target }}/release/ferrolint
      - uses: actions/upload-artifact@v7
        with:
          name: ferrolint-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ferrolint
          if-no-files-found: error
      - run: make wheel TARGET=${{ matrix.target }}
      - name: Install the wheel and smoke-test it
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv" target/wheels/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/ferrolint" --version
          "$RUNNER_TEMP/wheel-venv/bin/python" -m ferrolint --version
          make smoke BIN="$RUNNER_TEMP/wheel-venv/bin/ferrolint"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: target/wheels/*.whl
          if-no-files-found: error
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make sdist
      - name: Install the sdist and smoke-test it
        run: |
          uv venv "$RUNNER_TEMP/sdist-venv"
          uv pip install --python "$RUNNER_TEMP/sdist-venv" target/wheels/*.tar.gz
          make smoke BIN="$RUNNER_TEMP/sdist-venv/bin/ferrolint"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-sdist
          path: target/wheels/*.tar.gz
          if-no-files-found: error
  publish:
    needs: [build, sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
  crates:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - id: version
        run: echo "v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="ferrolint-plugin-sdk") | .version')" >> "$GITHUB_OUTPUT"
      - id: exists
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'ferrolint-release' "https://crates.io/api/v1/crates/ferrolint-plugin-sdk/${{ steps.version.outputs.v }}")
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.code == '404'
        run: cargo publish --locked -p ferrolint-plugin-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
