name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5
      - run: pnpm install --frozen-lockfile
      - run: make makefile-lint
      - run: make md-lint
      - run: make spell
      - run: make commits-check
      - run: pre-commit run --all-files
        env:
          # The rust workflow's `make check` already runs both.
          SKIP: rust-fmt,clippy
