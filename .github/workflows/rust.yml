name: rust
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Only main saves: dependabot PRs would fill the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ hashFiles('mk/rust.mk') }}
      - if: steps.deny.outputs.cache-hit != 'true'
        run: make install-rust
      - run: make check
      - run: make test
      - run: make ty-check
