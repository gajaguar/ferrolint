[tools]
node = "24"
pnpm = "12"
pre-commit = "4"
checkmake = "0.3.2"
uv = "0.12"

[settings.npm]
package_manager = "pnpm"

[tools.rust]
# mise's rust backend reads this section; it does not read
# rust-toolchain.toml, so this is the one place a target or component is
# declared. wasm32-wasip2 is what plugins build to; the other three are the
# release targets.
version = "1.99"
components = ["clippy", "rustfmt"]
targets = [
  "wasm32-wasip2",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
]
