[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib"]
unused-allowed-license = "allow"

# Only the `ty` feature brings these crates; the default graph never meets them.
exceptions = [
    { crate = "colored", allow = ["MPL-2.0"] },
    { crate = "notify", allow = ["CC0-1.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
    { crate = "version-ranges", allow = ["MPL-2.0"] },
]

[advisories]
# The `ty` feature only: ruff_db reads its own embedded typeshed archive, and
# nothing extracts a zip or feeds a stream from outside. No patched release.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip extraction is never called" },
    { id = "RUSTSEC-2026-0368", reason = "zip extraction is never called" },
    { id = "RUSTSEC-2026-0369", reason = "zip extraction is never called" },
    { id = "RUSTSEC-2026-0429", reason = "zip extraction is never called" },
    { id = "RUSTSEC-2026-0391", reason = "zstd only reads the embedded typeshed" },
    { id = "RUSTSEC-2026-0398", reason = "zstd only reads the embedded typeshed" },
    { id = "RUSTSEC-2026-0403", reason = "zstd only reads the embedded typeshed" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[[licenses.clarify]]
name = "ruff_text_size"
expression = "MIT"
license-files = [{ path = "../../LICENSE", hash = 0xfb156377 }]

[sources.allow-org]
github = ["astral-sh"]
