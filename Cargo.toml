[workspace]
members = ["crates/*", "plugins/*"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
description = "Extensible Python linter in Rust that runs custom rules as WASM plugins next to Ruff"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
toml = "1.1"
wasmtime = "=49.0.3"
wasmtime-wasi = "=49.0.3"
wit-bindgen = "0.63"
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "0.17.1" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", tag = "0.17.1" }
ruff_python_semantic = { git = "https://github.com/astral-sh/ruff.git", tag = "0.17.1" }
ruff_python_stdlib = { git = "https://github.com/astral-sh/ruff.git", tag = "0.17.1" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", tag = "0.17.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
