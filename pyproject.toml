[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ferrolint"
requires-python = ">=3.9"
dynamic = ["version", "description", "license"]
readme = "README.md"
license-files = ["LICENSE"]
keywords = ["linter", "pylint", "ruff", "wasm", "plugins"]
classifiers = [
  # Beta until 1.0.0, the first release published to PyPI.
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/gajaguar/ferrolint"
Changelog = "https://github.com/gajaguar/ferrolint/releases"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/ferrolint/Cargo.toml"
python-source = "python"
module-name = "ferrolint"
strip = true
features = ["bundle"]
locked = true
# The sdist builds the plugins (the bundle feature), which no crate depends on.
include = [
  { path = "plugins/**/*", format = "sdist" },
  { path = "wit/**/*", format = "sdist" },
  { path = "crates/ferrolint-plugin-sdk/**/*", format = "sdist" },
]
