version: "0.2"
language: en
allowCompoundWords: true

dictionaryDefinitions:
  - name: project-words
    path: ./dictionary.txt

dictionaries:
  - project-words
  - bash
  - filetypes
  - python

ignorePaths:
  - "**/node_modules/**"
  - "**/*.lock"
  - "**/pnpm-lock.yaml"
  - ".gitignore" # vendored toptal.com boilerplate, not authored here
  - "scripts/templates/gitignore/snapshot" # same toptal.com boilerplate, vendored as a fallback
  - "**/target/**"
  - "crates/ferrolint/tests/data/**" # vendored OASIS SARIF schema
  - ".claude/skills/**" # vendored third-party skill, not authored here
  - "crates/ferrolint/src/pylint_names.rs" # generated from Pylint's own message names
  - "crates/ferrolint/src/c_module_names.rs" # generated from the names CPython exports
